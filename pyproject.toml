[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nosql-rag-research"
version = "0.1.0"
description = "ML-Driven NoSQL Pattern Selection for Retrieval-Augmented Generation Workloads"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hiten Bhurani", email = "2023.hiten.bhurani@ves.ac.in"}
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "psutil>=5.9.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "shap>=0.45.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.1",
    "beir>=2.2.0",
    "sentence-transformers>=6.3.0",
]

[project.optional-dependencies]
databases = [
    "redis>=5.0.0",
    "pymongo>=4.6.0",
    "cassandra-driver>=3.29.0",
    "pyasyncore>=1.0.4; python_version >= '3.12'",
    "neo4j>=5.18.0",
    "qdrant-client>=1.9.0",
]
rag = [
    "sentence-transformers>=2.6.0",
    "beir>=2.0.0",
]
dashboard = [
    "streamlit>=1.49.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
all = [
    "nosql-rag-research[databases,rag,dashboard,dev]",
]

[project.scripts]
nosql-rag = "nosql_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: marks tests requiring live database endpoints or credentials (deselect with '-m \"not integration\"')",
    "slow: marks slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
