# Central Experiment Configuration for nosql-rag-research
random_seed: 42
primary_objective: min_p95_latency_ms
max_allowed_error_rate: 0.01
min_required_recall_at_k: 0.90

pilot:
  n_profiles: 2
  operations: 250
  records: 200
  repetitions: 1
  concurrency_levels: [1]
  warmup_operations: 20
  cleanup_after_run: true
  timeout_seconds: 120

full_matrix:
  n_profiles: 75
  operations: 1500
  records: 1000
  repetitions: 3
  batch_size: 5
  concurrency_levels: [1, 4]
  warmup_operations: 20
  cleanup_after_run: true
  timeout_seconds: 300

qdrant_ann:
  n_vectors: 2000
  n_queries: 100
  vector_size: 128
  top_k: 10
  distance: COSINE
  batch_size: 256

beir_rag:
  dataset_name: scifact
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  top_k: 10
  max_queries: 200
  chunk_strategy: title_plus_body_full
  normalize_embeddings: true

ml:
  test_size: 0.25
  cv_folds: 5
  group_column: workload_id
  target_column: best_store
  feature_columns:
    - query_type
    - read_ratio
    - write_ratio
    - payload_bytes
    - dataset_records
    - data_size_mb
    - concurrency
